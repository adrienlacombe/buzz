name: Release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'desktop-v[0-9]*'

jobs:
  # Shared setup: verify the immutable release tag, determine the version, and
  # create the release objects all four platform jobs upload into.
  setup:
    name: Setup
    # FORK-LOCAL PATCH (adrienlacombe/buzz): RELEASE_REPO opts a fork in.
    # NOTE: the two macOS jobs below are deliberately left pinned to
    # 'block/buzz'. They call block/apple-codesign-action with an AWS role and
    # S3 bucket that only Block can reach, so un-guarding them would burn two
    # full macOS Tauri builds before dying at the codesign step. They skip;
    # release-linux and release-windows are the fork-testable lanes.
    if: github.repository == (vars.RELEASE_REPO != '' && vars.RELEASE_REPO || 'block/buzz')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 0.4.0 or 1.0.0-beta.1)"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/verify-release-ref.sh desktop-v "$VERSION"
          echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    if: github.repository == 'block/buzz'
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # required by block/apple-codesign-action for OIDC
    outputs:
      archive_name: ${{ steps.artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate unsigned DMG
        id: unsigned
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # mdx-ios-codesign-helper discovers this file by its exact lowercase basename.
      - name: Stage signing entitlements
        run: cp desktop/src-tauri/Entitlements.plist "${RUNNER_TEMP}/entitlements.plist"

      - name: Codesign and Notarize
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde # v1.1.0
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: ${{ steps.unsigned.outputs.dmg }}
          entitlements-plist-path: ${{ runner.temp }}/entitlements.plist
          artifact-name: buzz-${{ github.sha }}-${{ github.run_id }}-arm64

      - name: Replace DMG and rebuild updater archive
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
          UNSIGNED_DMG: ${{ steps.unsigned.outputs.dmg }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          APP_DIR="${BUNDLE_DIR}/macos"

          # Replace unsigned DMG with the signed/notarized one.
          cp "$SIGNED_DMG" "$UNSIGNED_DMG"

          # Swap the unsigned .app for the signed .app extracted from the action's zip.
          EXTRACT_DIR="${RUNNER_TEMP}/signed-app-extract"
          rm -rf "$EXTRACT_DIR" && mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$SIGNED_APP_ZIP" "$EXTRACT_DIR"
          rm -rf "${APP_DIR}/Buzz.app"
          cp -R "${EXTRACT_DIR}/Buzz.app" "${APP_DIR}/Buzz.app"

          # Rebuild the updater archive from the signed .app and re-sign it with the Tauri updater key.
          rm -f "${APP_DIR}/Buzz.app.tar.gz" "${APP_DIR}/Buzz.app.tar.gz.sig"
          (cd "$APP_DIR" && tar -czf Buzz.app.tar.gz Buzz.app)
          TARBALL_ABS="$(pwd)/${APP_DIR}/Buzz.app.tar.gz"
          (cd desktop && pnpm tauri signer sign "$TARBALL_ABS")

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            desktop/src-tauri/target/release/bundle/macos/Buzz.app
          spctl --assess --type execute --verbose=4 \
            desktop/src-tauri/target/release/bundle/macos/Buzz.app
          desktop/scripts/verify-macos-entitlements.sh \
            desktop/src-tauri/target/release/bundle/macos/Buzz.app

      - name: Locate build artifacts
        id: artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          # Find the DMG (Tauri names it Buzz_<version>_<arch>.dmg)
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

          # Find the updater .tar.gz and .sig. Give each architecture a unique
          # release basename before artifacts are merged by the final writer.
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          SIG="${ARCHIVE}.sig"
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"
            exit 1
          fi
          RENAMED="$(dirname "$ARCHIVE")/Buzz_${VERSION}_aarch64.app.tar.gz"
          mv "$ARCHIVE" "$RENAMED"
          mv "$SIG" "${RENAMED}.sig"
          ARCHIVE="$RENAMED"
          SIG="${RENAMED}.sig"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.artifacts.outputs.sig }}

      - name: Stage Apple Silicon release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-macos-arm64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

  release-macos-x64:
    name: Release macOS (Intel)
    if: github.repository == 'block/buzz'
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # required by block/apple-codesign-action for OIDC
    outputs:
      archive_name: ${{ steps.artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --target "$TARGET" --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate unsigned DMG
        id: unsigned
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # mdx-ios-codesign-helper discovers this file by its exact lowercase basename.
      - name: Stage signing entitlements
        run: cp desktop/src-tauri/Entitlements.plist "${RUNNER_TEMP}/entitlements.plist"

      - name: Codesign and Notarize
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde # v1.1.0
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: ${{ steps.unsigned.outputs.dmg }}
          entitlements-plist-path: ${{ runner.temp }}/entitlements.plist
          artifact-name: buzz-${{ github.sha }}-${{ github.run_id }}-x64

      - name: Replace DMG and rebuild updater archive
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
          UNSIGNED_DMG: ${{ steps.unsigned.outputs.dmg }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/macos"

          # Replace the unsigned DMG with the signed/notarized one.
          cp "$SIGNED_DMG" "$UNSIGNED_DMG"

          # Swap the unsigned .app for the signed .app from the action's zip.
          EXTRACT_DIR="${RUNNER_TEMP}/signed-app-extract-x64"
          rm -rf "$EXTRACT_DIR" && mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$SIGNED_APP_ZIP" "$EXTRACT_DIR"
          rm -rf "${APP_DIR}/Buzz.app"
          cp -R "${EXTRACT_DIR}/Buzz.app" "${APP_DIR}/Buzz.app"

          # Rebuild the updater archive from the signed .app and re-sign with the Tauri updater key.
          rm -f "${APP_DIR}/Buzz.app.tar.gz" "${APP_DIR}/Buzz.app.tar.gz.sig"
          (cd "$APP_DIR" && tar -czf Buzz.app.tar.gz Buzz.app)
          TARBALL_ABS="$(pwd)/${APP_DIR}/Buzz.app.tar.gz"
          (cd desktop && pnpm tauri signer sign "$TARBALL_ABS")

      - name: Verify code signature
        run: |
          APP_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          spctl --assess --type execute --verbose=4 "$APP_DIR"
          desktop/scripts/verify-macos-entitlements.sh "$APP_DIR"

      - name: Locate updater archive
        id: artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"

          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          SIG="${ARCHIVE}.sig"
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"
            exit 1
          fi
          RENAMED="$(dirname "$ARCHIVE")/Buzz_${VERSION}_x64.app.tar.gz"
          mv "$ARCHIVE" "$RENAMED"
          mv "$SIG" "${RENAMED}.sig"
          ARCHIVE="$RENAMED"
          SIG="${RENAMED}.sig"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.artifacts.outputs.sig }}

      - name: Stage Intel macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-macos-x64
          if-no-files-found: error
          path: |
            ${{ steps.unsigned.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

  # FORK-LOCAL PATCH (adrienlacombe/buzz): unsigned macOS release lane, new job.
  #
  # The signed `release` job above cannot run outside block/buzz: it calls
  # block/apple-codesign-action, whose Apple certificate lives inside Block's
  # internal codesign_helper Lambda, so no secret a fork could supply makes it
  # work. Without a macOS lane at all, this fork's latest.json advertises only
  # linux-x86_64 and windows-x86_64, and Mac installs never auto-update.
  #
  # This lane produces the same updater artifacts with no OS trust anchor. The
  # build already emits <Product>.app.tar.gz and its .sig, because
  # build-release-config.mjs sets createUpdaterArtifacts and the Tauri signing
  # key is in the environment — so unlike the signed lane there is nothing to
  # rebuild afterwards, and none of its Buzz.app-hardcoded paths are inherited.
  #
  # What this deliberately does NOT give, and users must be told:
  #   - The app is only ad-hoc signed and never notarized, so a FIRST install
  #     still needs `xattr -dr com.apple.quarantine`. Auto-update does not remove
  #     that step, it stops it repeating: later updates are written by the app
  #     itself and so are never quarantined.
  #   - The ad-hoc cdhash changes every build, so macOS may treat each update as
  #     a different program for keychain ACL purposes and re-prompt for, or lose,
  #     access to the stored identity. The app-data identity.key fallback is what
  #     carries the identity through.
  #   - The only thing gating what installs is the Tauri updater key plus write
  #     access to this repo's releases. There is no second opinion from Apple.
  #
  # Mutually exclusive with `release` by construction: that job requires
  # block/buzz and this one requires NOT block/buzz, so exactly one can ever
  # supply darwin-aarch64. assemble-manifest asserts that rather than trusting it.
  release-macos-unsigned:
    name: Release macOS (unsigned)
    if: |
      github.repository == (vars.RELEASE_REPO != '' && vars.RELEASE_REPO || 'block/buzz') &&
      github.repository != 'block/buzz'
    runs-on: macos-latest
    needs: setup
    # Longer than the signed lane's 60: that one is only ever exercised with a
    # warm mesh-llama cache, and a cold Metal llama build is the slow path here.
    timeout-minutes: 90
    permissions:
      # `read`, matching every other platform lane: since #3568 this job hands its
      # artifacts to assemble-manifest and no longer touches a release itself.
      contents: read
    outputs:
      archive_name: ${{ steps.artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        # FORK-LOCAL PATCH (adrienlacombe/buzz): `desktop-v`, not `v`. Upstream
        # renamed the release tag prefix in #3568 and updated all four of its own
        # lanes; this lane is fork-local so the rename never reached it, and a
        # stale `v` prefix fails here against a tag that is no longer created.
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          # FORK-LOCAL PATCH (adrienlacombe/buzz): nothing signs this lane's bundle
          # after the build, so Tauri has to ad-hoc sign it during bundling — before
          # the DMG is assembled around it. Deliberately absent from the two
          # block/buzz macOS lanes, which must reach block/apple-codesign-action
          # unsigned, and from release-linux / release-windows where it is moot.
          BUZZ_MACOS_ADHOC_SIGN: "1"

      # FORK-LOCAL PATCH (adrienlacombe/buzz): buzz-backend-kubernetes is built
      # here for the same reason upstream builds it in every non-Windows lane —
      # tauri.conf.json lists it in externalBin and bundle-sidecars.sh exits 1
      # when it is missing. This job is fork-added, so upstream's sweep that
      # updated its own lanes could not reach it.
      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Read from desktop/src-tauri/Cargo.lock, NOT the root one. Desktop is
      # excluded from the root workspace, so the two locks pin mesh-llm
      # independently and the step below fetches the *desktop* manifest — the
      # root lock names a checkout that is never fetched. The signed lane above
      # (:151) and signed-macos-canary.yml:104 still carry that bug; it is
      # masked there by a warm cache. Same fix as ci.yml and macos-canary.yml.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("desktop/src-tauri/Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from desktop/src-tauri/Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      # FORK-LOCAL PATCH (adrienlacombe/buzz): no `--no-sign` here, unlike the two
      # signed macOS lanes above and macos-canary.yml.
      #
      # Tauri 2's `--no-sign` skips Apple signing *and* updater signing — it ends
      # the build with `Updater signing is skipped due to --no-sign flag`, so the
      # .app.tar.gz is produced without its .sig and the next step fails with
      # "Updater archive or signature not found". That is exactly how
      # desktop-v0.0.0-forktest.4 failed on this lane's first ever run.
      #
      # The updater signature comes from this fork's own throwaway Tauri keypair
      # and has nothing to do with Apple's trust chain, so there is no reason to
      # suppress it. The signed lanes can afford the flag because
      # block/apple-codesign-action re-signs afterwards; this lane has no such
      # step, and macos-canary.yml sets createUpdaterArtifacts: false so it never
      # wants a .sig at all.
      #
      # Dropping the flag does not reintroduce Apple signing. What it does enable is
      # the ad-hoc *bundle* signature requested via BUZZ_MACOS_ADHOC_SIGN on the
      # config step above, and that turned out to be load-bearing: without it Tauri
      # emitted an .app with no Contents/_CodeSignature at all, only the linker's
      # ad-hoc signature on the executable, and macOS rejected the result as
      # "BitcoinMarkets is damaged and can't be opened" — unfixable by clearing the
      # quarantine attribute. An earlier version of this comment asserted the linker
      # signature "is what lets the result run on Apple Silicon at all". It is not;
      # a signed executable is not a signed bundle. Every macOS artifact this fork
      # produced was unlaunchable until forktest.6.
      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          # FORK-LOCAL PATCH (adrienlacombe/buzz): upstream's own opt-in for a build
          # whose default relay is reviewed and fixed. This fork is single-relay by
          # construction — relay/allowlist.rs pins the host and release builds already
          # default to wss://relay.bitcoinmarkets.app — so the "Join or create a
          # community" picker offers a choice that does not exist. With this set,
          # useCommunityInit auto-creates that one community and the picker never shows.
          # Compile-time (option_env!), so it must be present at build time, not runtime.
          # Deliberately absent from the two block/buzz macOS lanes (they never run here)
          # and from debug builds, where the loopback default correctly keeps the picker.
          BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY: "1"
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

          # Discovered by glob, never by product name: this fork renamed
          # productName to BitcoinMarkets, and the signed lane's hardcoded
          # Buzz.app paths are exactly what that rename would have broken.
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          SIG="${ARCHIVE}.sig"
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            # The archive existing without its .sig means the build was told not to
            # sign, not that the key is missing — check for `--no-sign` on the
            # build step first, then createUpdaterArtifacts and the key.
            [[ -n "$ARCHIVE" && ! -f "$SIG" ]] && echo "::error::Found $ARCHIVE but no $SIG — the build almost certainly ran with --no-sign, which skips updater signing as well as Apple signing"
            echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos — check for --no-sign on the build step, then createUpdaterArtifacts and TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.artifacts.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # Records what the app is and is not, so the absence of notarization is a
      # published fact rather than something a user discovers from Gatekeeper.
      # FORK-LOCAL PATCH (adrienlacombe/buzz): this step used to only *report*, with
      # every command ending in `|| true`, and that is precisely how an unlaunchable
      # DMG reached a published release. The diagnostic ran, printed
      # `flags=0x20002(adhoc,linker-signed)`, and nobody could tell that was the
      # broken state rather than the intended one. It now asserts.
      #
      # The bar is a valid *bundle* signature. A linker-signed executable inside a
      # bundle with no Contents/_CodeSignature is what macOS reports as
      # "is damaged and can't be opened", and clearing the quarantine attribute does
      # not help. `--deep --strict` is what distinguishes the two; `codesign -dv`
      # alone reports a signature in both cases.
      - name: Verify signing state
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)
          [[ -n "$APP" ]] || { echo "::error::no .app bundle found to verify"; exit 1; }

          echo "--- codesign -dv (expect adhoc, WITHOUT linker-signed) ---"
          codesign -dv --verbose=2 "$APP" 2>&1 || true

          if [[ ! -f "$APP/Contents/_CodeSignature/CodeResources" ]]; then
            echo "::error::$APP has no Contents/_CodeSignature/CodeResources — the bundle was never signed, only the executable. macOS will reject this as damaged. Is BUZZ_MACOS_ADHOC_SIGN set on the config step, and is --no-sign absent from the build?"
            exit 1
          fi

          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error::bundle signature is not valid; this artifact would fail to launch"
            exit 1
          fi
          echo "Bundle signature verified."

          # Informational only, and expected to fail: this lane is never notarized,
          # so a first install still needs `xattr -dr com.apple.quarantine`.
          echo "--- spctl --assess (expect: rejected, unnotarized) ---"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.artifacts.outputs.sig }}

      # FORK-LOCAL PATCH (adrienlacombe/buzz): ported to upstream's staged-artifact
      # handoff. This lane used to push to two releases itself — the DMG straight to
      # `v${VERSION}` and the updater archive to `buzz-desktop-latest`.
      # #3568 made the per-version release immutable and moved every platform lane
      # to publishing a `desktop-release-*` workflow artifact that
      # assemble-manifest downloads, flattens, verifies, and uploads exactly once.
      # Left on the old model this lane would push to a `v${VERSION}` tag that is
      # no longer created, and its archive would never land in `staged` — so the
      # fork's only darwin-aarch64 asset would be absent from both the release and
      # latest.json, which is the failure this whole lane exists to prevent.
      #
      # Do not name the upload command literally anywhere in this file, not even in
      # a comment: scripts/test-release-ref-contract.sh counts occurrences of that
      # string and fails unless there are exactly two, so prose mentioning it
      # breaks CI while every real call site is still correct.
      - name: Rename DMG to carry -unsigned
        id: unsigned-dmg
        env:
          DMG_PATH: ${{ steps.artifacts.outputs.dmg }}
        run: |
          set -euo pipefail
          # The filename is the only warning a user gets before double-clicking it,
          # so it carries -unsigned exactly as macos-canary.yml does.
          BASE=$(basename "$DMG_PATH" .dmg)
          STAGED="${RUNNER_TEMP}/${BASE}-unsigned.dmg"
          cp "$DMG_PATH" "$STAGED"
          echo "dmg=$STAGED" >> "$GITHUB_OUTPUT"

      - name: Stage Apple Silicon (unsigned) release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Matches assemble-manifest's `desktop-release-*` download pattern. A
          # distinct suffix from the signed lane's desktop-release-macos-arm64 so
          # the two never collide, though their `if:` conditions already make them
          # mutually exclusive.
          name: desktop-release-macos-arm64-unsigned
          if-no-files-found: error
          path: |
            ${{ steps.unsigned-dmg.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

  release-linux:
    name: Release Linux
    # FORK-LOCAL PATCH (adrienlacombe/buzz): needs only the Tauri updater
    # signing key, no OS trust anchor, so a fork can run this lane.
    if: github.repository == (vars.RELEASE_REPO != '' && vars.RELEASE_REPO || 'block/buzz')
    runs-on: ubuntu-latest
    # Digest-pinned like the SHA-pinned actions below; Renovate keeps it fresh.
    container: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    needs: setup
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # AppImage tools (linuxdeploy, appimagetool) are themselves AppImages.
      # Containers lack FUSE, so we must use the extract-and-run fallback.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    # This job runs in a container where the default run shell is dash;
    # the AppImage steps below use bash-only syntax ([[ ]], mapfile, arrays).
    defaults:
      run:
        shell: bash
    outputs:
      archive_name: ${{ steps.linux-artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Must run first: bare ubuntu:24.04 ships without curl, wget, git, or
          # ca-certificates. activate-hermit bootstraps via curl+HTTPS (needs
          # both), and actions/checkout falls back to a REST tarball without git.
          # Running as root — no sudo needed.
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils
          # Install GitHub CLI — preinstalled on runners but absent in containers.
          # wget and ca-certificates are now available from the step above.
          mkdir -p -m 755 /etc/apt/keyrings
          wget -q --tries=3 --timeout=30 -O /usr/share/keyrings/githubcli-archive-keyring.gpg \
            https://cli.github.com/packages/githubcli-archive-keyring.gpg
          # Pin the keyring like appimagetool below. If GitHub rotates the
          # keyring this fails loudly — recompute and update the hash.
          echo "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b  /usr/share/keyrings/githubcli-archive-keyring.gpg" | sha256sum -c
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag-bound release source
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          lookup-only: true

      - name: Install appimagetool
        run: |
          # Pin to an immutable release tag to avoid supply-chain drift from the
          # mutable `continuous` tag. Tag: 1.9.1, asset: appimagetool-<arch>.AppImage
          # (https://github.com/AppImage/appimagetool/releases/tag/1.9.1)
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            aarch64) ARCH_SUFFIX="aarch64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          # SHA256 integrity check. Refuse to run an unverified binary: if a new
          # arch (e.g. aarch64) is enabled in CI, compute its hash and add it here.
          if [[ "$ARCH_SUFFIX" == "x86_64" ]]; then
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          else
            echo "::error::No pinned SHA256 for appimagetool-${ARCH_SUFFIX} — add it before enabling this architecture"
            exit 1
          fi
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          # appimagetool otherwise fetches the AppImage type2 runtime from the
          # MUTABLE `continuous` tag at repack time — the runtime is the first
          # code users execute, so pin it too. Tag: 20251108, hash is for the
          # x86_64 asset (non-x86_64 already hard-fails above).
          # (https://github.com/AppImage/type2-runtime/releases/tag/20251108)
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          # FORK-LOCAL PATCH (adrienlacombe/buzz): upstream's own opt-in for a build
          # whose default relay is reviewed and fixed. This fork is single-relay by
          # construction — relay/allowlist.rs pins the host and release builds already
          # default to wss://relay.bitcoinmarkets.app — so the "Join or create a
          # community" picker offers a choice that does not exist. With this set,
          # useCommunityInit auto-creates that one community and the picker never shows.
          # Compile-time (option_env!), so it must be present at build time, not runtime.
          # Deliberately absent from the two block/buzz macOS lanes (they never run here)
          # and from debug builds, where the loopback default correctly keeps the picker.
          BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY: "1"
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#APPIMAGES[@]} -eq 0 ]]; then
            echo "::error::No AppImage found to post-process"
            exit 1
          fi
          if [[ ${#APPIMAGES[@]} -gt 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]}"
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate Linux build artifacts
        id: linux-artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -type f | head -1)
          if [[ -z "$DEB" ]]; then
            echo "::error::No DEB found in $BUNDLE_DIR/deb"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' -type f | head -1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "::error::No AppImage found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

          # Updater archive: Tauri 2.11+ with createUpdaterArtifacts signs the
          # AppImage directly (*.AppImage + *.AppImage.sig). Earlier versions
          # wrapped it in a tar.gz. Try the new format first, fall back to legacy.
          ARCHIVE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' ! -name '*.sig' -type f | head -1)
          if [[ -n "$ARCHIVE" ]]; then
            SIG="${ARCHIVE}.sig"
          else
            ARCHIVE="$APPIMAGE"
            SIG="${APPIMAGE}.sig"
          fi
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::AppImage updater archive or signature not found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.linux-artifacts.outputs.sig }}

      # NOTE: .deb is NOT auto-updatable (Tauri updater constraint — only AppImage supports it on Linux)
      - name: Stage Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-linux-x64
          if-no-files-found: error
          path: |
            ${{ steps.linux-artifacts.outputs.deb }}
            ${{ steps.linux-artifacts.outputs.appimage }}
            ${{ steps.linux-artifacts.outputs.archive }}
            ${{ steps.linux-artifacts.outputs.sig }}

  release-windows:
    name: Release Windows
    runs-on: windows-latest
    needs: setup
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      archive_name: ${{ steps.artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        shell: bash
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          # Disable dependency caching: a writable cache in this release workflow
          # (contents: read, feeds a signed installer) is a poisoning vector. pnpm
          # install runs uncached below.
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Patch version
        shell: bash
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        shell: bash
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          # FORK-LOCAL PATCH (adrienlacombe/buzz): upstream's own opt-in for a build
          # whose default relay is reviewed and fixed. This fork is single-relay by
          # construction — relay/allowlist.rs pins the host and release builds already
          # default to wss://relay.bitcoinmarkets.app — so the "Join or create a
          # community" picker offers a choice that does not exist. With this set,
          # useCommunityInit auto-creates that one community and the picker never shows.
          # Compile-time (option_env!), so it must be present at build time, not runtime.
          # Deliberately absent from the two block/buzz macOS lanes (they never run here)
          # and from debug builds, where the loopback default correctly keeps the picker.
          BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY: "1"
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY || secrets.SPROUT_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/buzz-desktop-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Locate Windows build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"

          # Find the NSIS installer .exe
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi

          # Tauri 2.x with createUpdaterArtifacts: true signs the NSIS
          # installer in place (<name>-setup.exe + <name>-setup.exe.sig).
          SIG="${EXE}.sig"
          if [[ ! -f "$SIG" ]]; then
            echo "::error::NSIS installer signature not found: $SIG"
            exit 1
          fi

          # Rename with _alpha-unsigned marker, keeping the detached signature
          # in lockstep so latest.json matches the uploaded updater artifact.
          EXE_DIR=$(dirname "$EXE")
          EXE_BASE=$(basename "$EXE" .exe)
          MARKED_EXE="${EXE_DIR}/${EXE_BASE}_alpha-unsigned.exe"
          MARKED_SIG="${MARKED_EXE}.sig"
          mv "$EXE" "$MARKED_EXE"
          mv "$SIG" "$MARKED_SIG"
          echo "exe=$MARKED_EXE" >> "$GITHUB_OUTPUT"
          echo "archive=$MARKED_EXE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$MARKED_EXE")" >> "$GITHUB_OUTPUT"
          echo "sig=$MARKED_SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        shell: bash
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.artifacts.outputs.sig }}

      - name: Stage Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-windows-x64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.exe }}
            ${{ steps.artifacts.outputs.sig }}

  assemble-manifest:
    name: Assemble multi-platform latest.json
    # Only the tag-bound setup path can reach this job.
    #
    # FORK-LOCAL PATCH (adrienlacombe/buzz): upstream requires `release` and
    # `release-macos-x64` to report success. Both are pinned to
    # `github.repository == 'block/buzz'`, so in a fork they always report
    # `skipped` and upstream's gate can never be satisfied — the same failure
    # 67917a9bf fixed, where every updater archive and .sig uploaded fine and only
    # latest.json was missing. The daily sync reintroduced it silently: our side
    # had *removed* a condition here while upstream *added* these, so git saw no
    # conflict and took upstream's wholesale.
    #
    # Reachable here without weakening upstream: accept either darwin-aarch64 lane
    # (their `if:` conditions are complementary, so exactly one ever runs), and
    # accept `skipped` only for the signed x64 lane, which no fork can run. On
    # block/buzz every lane still has to succeed.
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.release.result == 'success' || needs.release-macos-unsigned.result == 'success') &&
      (needs.release-macos-x64.result == 'success' || needs.release-macos-x64.result == 'skipped') &&
      needs.release-linux.result == 'success' &&
      needs.release-windows.result == 'success' &&
      github.ref == format('refs/tags/desktop-v{0}', needs.setup.outputs.version)
    runs-on: ubuntu-latest
    # FORK-LOCAL PATCH (adrienlacombe/buzz): release-macos-unsigned added. It is
    # the fork's darwin-aarch64 provider, mutually exclusive with `release`.
    needs: [setup, release, release-macos-unsigned, release-macos-x64, release-linux, release-windows]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - name: Download staged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-release-*
          path: staged-by-platform

      - name: Flatten staged artifacts without basename collisions
        run: |
          set -euo pipefail
          mkdir staged
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            [[ ! -e "staged/$name" ]] || {
              echo "::error::release artifact basename collision: $name"
              exit 1
            }
            cp "$file" "staged/$name"
          done < <(find staged-by-platform -type f -print0)

      - name: Write signature files
        env:
          RESULT_ARM64: ${{ needs.release.result }}
          # FORK-LOCAL PATCH (adrienlacombe/buzz): the fork's darwin-aarch64.
          RESULT_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.result }}
          RESULT_X64: ${{ needs.release-macos-x64.result }}
          RESULT_LINUX: ${{ needs.release-linux.result }}
          RESULT_WIN: ${{ needs.release-windows.result }}
          SIG_ARM64: ${{ needs.release.outputs.sig }}
          SIG_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.outputs.sig }}
          SIG_X64: ${{ needs.release-macos-x64.outputs.sig }}
          SIG_LINUX: ${{ needs.release-linux.outputs.sig }}
          SIG_WIN: ${{ needs.release-windows.outputs.sig }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sigs

          # FORK-LOCAL PATCH (adrienlacombe/buzz): two jobs can supply
          # darwin-aarch64 — the signed `release` (block/buzz only) and this
          # fork's `release-macos-unsigned` (never block/buzz). Their `if:`
          # conditions are complementary, so exactly one can run. Asserted rather
          # than assumed: if both ever succeeded, the later write_sig would
          # silently overwrite the earlier and the manifest would carry one
          # platform's signature against the other's URL, which no client could
          # verify and no later step would catch.
          if [[ "$RESULT_ARM64" == "success" && "$RESULT_MAC_UNSIGNED" == "success" ]]; then
            echo "::error::Both the signed and unsigned macOS lanes succeeded; they must be mutually exclusive"
            exit 1
          fi

          write_sig() {
            local result="$1" platform="$2" sig="$3"
            if [[ "$result" == "success" ]]; then
              [[ -n "$sig" ]] || { echo "::error::Missing signature for successful platform: $platform"; exit 1; }
              printf '%s' "$sig" > "/tmp/sigs/${platform}.sig"
            fi
          }

          write_sig "$RESULT_ARM64" darwin-aarch64 "$SIG_ARM64"
          write_sig "$RESULT_MAC_UNSIGNED" darwin-aarch64 "$SIG_MAC_UNSIGNED"
          write_sig "$RESULT_X64" darwin-x86_64 "$SIG_X64"
          write_sig "$RESULT_LINUX" linux-x86_64 "$SIG_LINUX"
          write_sig "$RESULT_WIN" windows-x86_64 "$SIG_WIN"

      - name: Verify draft release has every updater archive
        env:
          RESULT_ARM64: ${{ needs.release.result }}
          # FORK-LOCAL PATCH (adrienlacombe/buzz): the fork's darwin-aarch64.
          RESULT_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.result }}
          RESULT_X64: ${{ needs.release-macos-x64.result }}
          RESULT_LINUX: ${{ needs.release-linux.result }}
          RESULT_WIN: ${{ needs.release-windows.result }}
          ARCHIVE_ARM64: ${{ needs.release.outputs.archive_name }}
          ARCHIVE_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.outputs.archive_name }}
          ARCHIVE_X64: ${{ needs.release-macos-x64.outputs.archive_name }}
          ARCHIVE_LINUX: ${{ needs.release-linux.outputs.archive_name }}
          ARCHIVE_WIN: ${{ needs.release-windows.outputs.archive_name }}
        run: |
          set -euo pipefail
          assets=$(find staged -type f -exec basename {} \;)
          # FORK-LOCAL PATCH (adrienlacombe/buzz): RESULT_MAC_UNSIGNED added to the
          # spec list. Upstream lists only its four lanes, so without this the
          # fork's darwin-aarch64 archive is the one asset never checked against
          # the staged set — the single platform whose absence this step exists to
          # catch. The marker sits above the list because a `#` cannot appear
          # inside a backslash-continued `for` list.
          for spec in \
            "$RESULT_ARM64:$ARCHIVE_ARM64" \
            "$RESULT_MAC_UNSIGNED:$ARCHIVE_MAC_UNSIGNED" \
            "$RESULT_X64:$ARCHIVE_X64" \
            "$RESULT_LINUX:$ARCHIVE_LINUX" \
            "$RESULT_WIN:$ARCHIVE_WIN"; do
            result="${spec%%:*}"
            archive="${spec#*:}"
            if [[ "$result" == success ]]; then
              [[ -n "$archive" ]] || { echo "::error::successful platform has no archive"; exit 1; }
              grep -Fxq "$archive" <<<"$assets" || { echo "::error::draft release missing $archive"; exit 1; }
            fi
          done

      - name: Generate unified latest.json
        env:
          RESULT_ARM64: ${{ needs.release.result }}
          # FORK-LOCAL PATCH (adrienlacombe/buzz): the fork's darwin-aarch64.
          RESULT_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.result }}
          RESULT_X64: ${{ needs.release-macos-x64.result }}
          RESULT_LINUX: ${{ needs.release-linux.result }}
          RESULT_WIN: ${{ needs.release-windows.result }}
          ARCHIVE_ARM64: ${{ needs.release.outputs.archive_name }}
          ARCHIVE_MAC_UNSIGNED: ${{ needs.release-macos-unsigned.outputs.archive_name }}
          ARCHIVE_X64: ${{ needs.release-macos-x64.outputs.archive_name }}
          ARCHIVE_LINUX: ${{ needs.release-linux.outputs.archive_name }}
          ARCHIVE_WIN: ${{ needs.release-windows.outputs.archive_name }}
        run: |
          set -euo pipefail
          # FORK-LOCAL PATCH (adrienlacombe/buzz): the owner was hardcoded to
          # block/buzz, so a fork's latest.json pointed every download URL at
          # Block's releases — clients would verify this fork's signature against
          # Block's archive. GITHUB_REPOSITORY is correct upstream too, since the
          # release objects always live in the repo running the workflow. The
          # `desktop-v${VERSION}` path is upstream's (immutable per-version
          # releases, #3568) and is kept as-is.
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}"
          TRIPLES=()

          add_triple() {
            local result="$1" platform="$2" archive="$3"
            if [[ "$result" == "success" ]]; then
              [[ -n "$archive" ]] || { echo "::error::Missing archive name for successful platform: $platform"; exit 1; }
              TRIPLES+=("${platform}:/tmp/sigs/${platform}.sig:${BASE}/${archive}")
            fi
          }

          add_triple "$RESULT_ARM64" darwin-aarch64 "$ARCHIVE_ARM64"
          add_triple "$RESULT_MAC_UNSIGNED" darwin-aarch64 "$ARCHIVE_MAC_UNSIGNED"
          add_triple "$RESULT_X64" darwin-x86_64 "$ARCHIVE_X64"
          add_triple "$RESULT_LINUX" linux-x86_64 "$ARCHIVE_LINUX"
          add_triple "$RESULT_WIN" windows-x86_64 "$ARCHIVE_WIN"

          # FORK-LOCAL PATCH (adrienlacombe/buzz): was a bare `-ge 3`, which this
          # fork can never satisfy. Both macOS jobs stay pinned to block/buzz
          # because Block's internal codesigning service is unreachable here, so
          # they skip and only linux + windows remain. latest.json was therefore
          # never published and auto-update was dead on this fork — even though
          # every updater archive and .sig was already uploaded to the rolling
          # release. One missing file, not a missing feature.
          #
          # This is not the lowered threshold that would publish an incomplete
          # manifest as a complete one. The count was a proxy for "no platform is
          # missing"; a proxy that could not tell a job that skipped from a job
          # that broke. Asserting directly on the job results says what was meant,
          # and is *stricter* here than the count it replaces: `-ge 3` passed with
          # one macOS platform failed (3 of 4 succeeded), which silently stranded
          # that platform's installs. Now any attempted platform that did not
          # succeed fails the manifest.
          for entry in \
            "darwin-aarch64 (signed):$RESULT_ARM64" \
            "darwin-aarch64 (unsigned):$RESULT_MAC_UNSIGNED" \
            "darwin-x86_64:$RESULT_X64" \
            "linux-x86_64:$RESULT_LINUX" \
            "windows-x86_64:$RESULT_WIN"
          do
            platform="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              # skipped == structurally not built for this repo (the macOS jobs on
              # a fork). Anything else — failure, cancelled — means it was
              # attempted and did not deliver, so publishing would strand it.
              success | skipped) ;;
              *) echo "::error::$platform was attempted and did not succeed: $result"; exit 1 ;;
            esac
          done

          # Floor, not the correctness check: catches a config error that skips
          # every platform at once, which the loop above would otherwise pass.
          [ "${#TRIPLES[@]}" -ge 1 ] || { echo "::error::no platforms produced an updater archive"; exit 1; }
          echo "Publishing a manifest for ${#TRIPLES[@]} platform(s)."
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" "${TRIPLES[@]}" > latest.json
          cat latest.json

      - name: Create or verify versioned draft
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk "/^## v${VERSION}\$/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > "$NOTES_FILE"
          [[ -s "$NOTES_FILE" ]] || { echo "::error::missing non-empty changelog block for v${VERSION}"; exit 1; }
          PRERELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAGS=(--prerelease --latest=false)
          fi
          if gh release view "desktop-v${VERSION}" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh release view "desktop-v${VERSION}" --json targetCommitish --jq .targetCommitish)
            IS_DRAFT=$(gh release view "desktop-v${VERSION}" --json isDraft --jq .isDraft)
            [[ "$EXISTING_SHA" == "${{ needs.setup.outputs.source_sha }}" ]] || {
              echo "::error::existing release targets $EXISTING_SHA, not the immutable source"; exit 1;
            }
            if [[ "$IS_DRAFT" != true ]]; then
              echo "already_published=true" >> "$GITHUB_ENV"
            fi
          else
            gh release create "desktop-v${VERSION}" \
              --draft \
              --target "${{ needs.setup.outputs.source_sha }}" \
              --title "Buzz Desktop v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              "${PRERELEASE_FLAGS[@]}"
          fi

      - name: Upload complete artifact set to versioned draft
        if: env.already_published != 'true'
        run: |
          mapfile -t files < <(find staged -type f -print)
          [[ "${#files[@]}" -gt 0 ]] || { echo "::error::no staged release artifacts"; exit 1; }
          gh release upload "desktop-v${VERSION}" "${files[@]}" --clobber

      - name: Publish complete versioned release
        if: env.already_published != 'true'
        run: gh release edit "desktop-v${VERSION}" --draft=false

      - name: Upload latest.json to rolling release last
        if: ${{ !contains(needs.setup.outputs.version, '-') }}
        run: gh release upload buzz-desktop-latest latest.json --clobber
