name: macOS Canary (unsigned)

# FORK-LOCAL WORKFLOW (adrienlacombe/buzz) — not present upstream.
#
# Produces an UNSIGNED Apple Silicon DMG from main without creating a tag,
# GitHub Release, or auto-updater artifact. The DMG is available only as a
# short-lived GitHub Actions artifact for explicit testing.
#
# Why this exists: signed-macos-canary.yml and release.yml sign macOS builds
# through block/apple-codesign-action, which talks to Block's internal
# codesigning service (codesign_helper Lambda + Buildkite) via an OIDC AWS
# role. A fork cannot reach that infrastructure at all — the Apple certificate
# lives inside Block's Lambda, so there is no secret a fork could supply. This
# workflow keeps everything up to the codesign step and stops there, which is
# the entire macOS pipeline minus the one part a fork structurally cannot do.
#
# The resulting DMG is not notarized. Gatekeeper will refuse it on first open;
# see the job summary for how to run it locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS canary
    # RELEASE_REPO opts a fork in; matches linux-canary.yml / windows-canary.yml.
    if: github.repository == (vars.RELEASE_REPO != '' && vars.RELEASE_REPO || 'block/buzz')
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 60
    permissions:
      contents: read
      # No id-token: write — that is only needed for the OIDC codesign step.
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Canary builds must run from main; got $SOURCE_REF"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: macos-canary-unsigned-release

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Derive canary version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-test.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building unsigned canary version $VERSION from $GITHUB_SHA"

      - name: Patch canary version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate non-updating bundle config
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          {
            "bundle": {
              "macOS": {
                "minimumSystemVersion": "10.15"
              },
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Resolved from desktop/src-tauri/Cargo.lock, NOT the root one. Desktop is
      # excluded from the root workspace, so the two locks pin mesh-llm
      # independently (root: tag=v0.73.1 / 43103c5c, desktop: rev=f455d493). The
      # step below fetches the desktop manifest, so the root lock's rev names a
      # checkout that is never fetched. signed-macos-canary.yml:104 and the
      # pre-fix ci.yml both read the root lock and fail on a cold cache with
      #   ::error::mesh-llm checkout for 43103c5 not found after cargo fetch
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("desktop/src-tauri/Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from desktop/src-tauri/Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm --config src-tauri/tauri.canary.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate unsigned DMG
        id: unsigned
        run: |
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # Records what the build actually produced. On arm64 the linker applies an
      # ad-hoc signature, so `codesign --verify` can pass while `spctl --assess`
      # still rejects the app — ad-hoc is not a Developer ID and is not
      # notarized. Both are reported without failing the job.
      - name: Report signing state
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
        run: |
          set -uo pipefail
          MOUNT="${RUNNER_TEMP}/dmg-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -type d | head -1)
          echo "--- codesign -dv ---"
          codesign -dv --verbose=2 "$APP" 2>&1 || echo "(no signature)"
          echo "--- spctl --assess (expected to reject: not notarized) ---"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true
          hdiutil detach "$MOUNT" >/dev/null || true

      - name: Stage unsigned DMG
        id: artifact
        env:
          DMG_PATH: ${{ steps.unsigned.outputs.dmg }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Buzz_${VERSION}_aarch64-unsigned.dmg"
          cp "$DMG_PATH" "$RUNNER_TEMP/$NAME"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-macos-canary-unsigned-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Usage notes
        env:
          NAME: ${{ steps.artifact.outputs.name }}
        run: |
          {
            echo "### Unsigned macOS canary"
            echo
            printf '**Artifact:** `%s`\n' "$NAME"
            echo
            echo 'This DMG is **not notarized**. Gatekeeper will refuse to open it.'
            echo 'To run it on your own machine, clear the quarantine attribute'
            echo 'after copying Buzz.app to /Applications:'
            echo
            echo '```'
            echo 'xattr -dr com.apple.quarantine /Applications/Buzz.app'
            echo '```'
            echo
            echo 'Do not distribute this build. Notarization requires either'
            echo "Block's internal codesigning service (#mdx-ios) or a paid Apple"
            echo 'Developer ID certificate wired into the build directly.'
          } >> "$GITHUB_STEP_SUMMARY"
