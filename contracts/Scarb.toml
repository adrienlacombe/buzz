[package]
name = "buzz_starknet"
version = "0.1.0"
edition = "2024_07"
license = "Apache-2.0"
description = "Nostr-key-controlled Starknet accounts for Buzz (BIP-340)"

[dependencies]
openzeppelin_account = "2.0.0"
openzeppelin_introspection = "2.0.0"
starknet = "2.18.0"

[dev-dependencies]
snforge_std = "0.60.0"
assert_macros = "2.18.0"

[[target.starknet-contract]]
sierra = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
